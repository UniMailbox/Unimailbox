title = "Unimailbox public repository secret checks"

[extend]
useDefault = true

# Exact synthetic values AND exact fixture paths only; never ignore whole tests/docs.
# Local development keys are public fixtures, forbidden for deployed environments.

[[allowlists]]
description = "Reviewed synthetic fixture values in apps/web/src/features/admin/ConnectionsPage.test.tsx"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)apps/web/src/features/admin/ConnectionsPage\.test\.tsx$''']
regexes = [
  '''^whsec_live_never_logged_a73b$''',
]

[[allowlists]]
description = "Reviewed synthetic fixture values in apps/worker/src/http/routes/brevo.worker.test.ts"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)apps/worker/src/http/routes/brevo\.worker\.test\.ts$''']
