packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 ignores postinstall scripts by default. Approve the ones we need
# so the install actually completes a usable tree. esbuild + workerd are
# required by vitest-pool-workers; sharp is not used but appears in our
# transitive graph via vite.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false

minimumReleaseAgeExclude:
  - '@cloudflare/vitest-pool-workers@0.21.1'
  - miniflare@5.20260804.1-alpha
  - wrangler@4.121.0
  - '@cloudflare/workers-types@5.20260812.1'
