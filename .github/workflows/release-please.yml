name: Publish stable release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: stable-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'UniMailbox/uni-mailbox'
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-notes:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag-name }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Append migration and compatibility notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag-name }}
        run: |
          set -euo pipefail
          base_file="$RUNNER_TEMP/release-please-notes.md"
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh release view "$TAG_NAME" --json body --jq .body > "$base_file"
          pnpm release:notes -- --tag "$TAG_NAME" --base-file "$base_file" --output "$notes_file"
          gh release edit "$TAG_NAME" --notes-file "$notes_file"

  distribute:
    needs: [release-please, release-notes]
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create distribution repository token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: UniMailbox
          repositories: unimailbox-deploy
          permission-contents: write

      - name: Check out canonical release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag-name }}
          path: canonical
          persist-credentials: false

      - name: Check out stable distribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UniMailbox/unimailbox-deploy
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          path: distribution

      - name: Publish immutable stable snapshot
        shell: bash
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag-name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          source_commit="$(git -C canonical rev-list -n 1 "$TAG_NAME")"
          if git -C distribution ls-remote --exit-code origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Distribution tag $TAG_NAME already exists and is immutable"
            exit 1
          fi

          git -C distribution rm --recursive --force --ignore-unmatch .
          git -C distribution clean -dffx
          git -C canonical archive "$TAG_NAME" | tar --extract --directory distribution
          mkdir -p distribution/.unimailbox
          jq --null-input \
            --arg version "$RELEASE_VERSION" \
            --arg tag "$TAG_NAME" \
            --arg source_commit "$source_commit" \
            '{
              schemaVersion: 1,
              sourceRepository: "UniMailbox/uni-mailbox",
              distributionRepository: "UniMailbox/unimailbox-deploy",
              channel: "stable",
              version: $version,
              tag: $tag,
              sourceCommit: $source_commit
            }' > distribution/.unimailbox/upstream.json

          git -C distribution add --all
          git -C distribution config user.name "unimailbox-release[bot]"
          git -C distribution config user.email "unimailbox-release[bot]@users.noreply.github.com"
          git -C distribution commit --message "chore(distribution): publish $TAG_NAME"
          distribution_commit="$(git -C distribution rev-parse HEAD)"
          git -C distribution tag --annotate "$TAG_NAME" --message "UniMailbox stable $TAG_NAME" "$distribution_commit"
          git -C distribution push --atomic origin HEAD:main "refs/tags/$TAG_NAME"
