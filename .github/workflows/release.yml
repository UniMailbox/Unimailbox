name: Production release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unimailbox-production
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository != 'UniMailbox/uni-mailbox' &&
      github.repository != 'UniMailbox/unimailbox-deploy' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOYMENT_URL }}
    env:
      DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify exact remote main source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)" || {
            echo "::error::The selected commit is no longer the remote main HEAD"
            exit 1
          }
      - name: Verify adopted installation and Cloudflare access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deployment:preflight
      - name: Select adopted Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          if jq --exit-status '.resources.r2 | length > 0' .unimailbox/installation.json >/dev/null; then
            echo 'UNIMAILBOX_WRANGLER_CONFIG=wrangler.r2.jsonc' >> "$GITHUB_ENV"
          else
            echo 'UNIMAILBOX_WRANGLER_CONFIG=wrangler.jsonc' >> "$GITHUB_ENV"
          fi
      - name: Verify configuration parity and release source
        run: |
          pnpm config:check
          pnpm scaffold doctor --ci
          pnpm format:check
          pnpm lint
          pnpm i18n:check
          pnpm frontend:contracts
          pnpm typecheck
          pnpm schema:check
          pnpm test
          pnpm db:migrate --target local
          pnpm db:verify --target local
          pnpm build
          pnpm deploy:dry-run
      - name: Build, bookmark, migrate, and promote
        id: production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm release:production
      - name: Post-promotion smoke tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL" || {
            echo "::error::The production Environment must define DEPLOYMENT_URL"
            exit 1
          }
          application_version="$(node --print "require('./package.json').version")"
          pnpm release:verify "$DEPLOYMENT_URL" "$application_version"
      - name: Roll back Worker after failed post-promotion verification
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -f .wrangler/release/manifest.json ]] &&
            jq --exit-status '.previousVersionId | type == "string" and length > 0' \
              .wrangler/release/manifest.json >/dev/null; then
            pnpm release:rollback
          else
            echo "No previous Worker version was captured; no Worker rollback is available."
          fi
      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-manifest-${{ github.sha }}
          path: |
            .wrangler/release/manifest.json
            .wrangler/release/version-upload.jsonl
          if-no-files-found: warn
          retention-days: 90
