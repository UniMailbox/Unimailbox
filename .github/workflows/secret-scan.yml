name: Secret scan
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks/release.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks/release.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks/release.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan all fetched history with redacted output
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" git --log-opts=--all
          --config .gitleaks.toml --redact --no-banner --no-color
