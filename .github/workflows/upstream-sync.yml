name: Sync stable upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository != 'UniMailbox/uni-mailbox' &&
      github.repository != 'UniMailbox/unimailbox-deploy' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update stable upgrade proposal
        env:
          GH_TOKEN: ${{ github.token }}
          UNIMAILBOX_SOURCE_REPOSITORY: UniMailbox/uni-mailbox
          UNIMAILBOX_DISTRIBUTION_REPOSITORY: UniMailbox/unimailbox-deploy
          UNIMAILBOX_UPDATE_CHANNEL: stable
        run: pnpm upstream:sync
